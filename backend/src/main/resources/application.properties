# ==============================================================================
# URL Shortener + Clickstream Analytics Platform — Spring Boot Configuration
# ==============================================================================

server.port=${PORT:3000}

# ── PostgreSQL (Neon Cloud) ───────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dev-insecure-secret-change-in-production}
app.jwt.expires-in=${JWT_EXPIRES_IN:7d}

# ── App ───────────────────────────────────────────────────────
app.base-url=${BASE_URL:https://novagk.dev}
app.short-code-length=${SHORT_CODE_LENGTH:7}

# ── CORS ──────────────────────────────────────────────────────
app.cors.origin=${CORS_ORIGIN:https://console.novagk.dev}
app.frontend-url=${FRONTEND_URL:https://console.novagk.dev}

# ── Upstash Redis ─────────────────────────────────────────────
app.upstash.redis.rest-url=${UPSTASH_REDIS_REST_URL:}
app.upstash.redis.rest-token=${UPSTASH_REDIS_REST_TOKEN:}
app.redis.url-ttl=${REDIS_URL_TTL:86400}

# ── Kafka (Aiven) ────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:url-shortener-click-consumers}
app.kafka.topic=${KAFKA_TOPIC:url-click-events}
app.kafka.client-id=${KAFKA_CLIENT_ID:url-shortener-api}

# ── ClickHouse Cloud ─────────────────────────────────────────
app.clickhouse.url=${CLICKHOUSE_URL:http://localhost:8123}
app.clickhouse.username=${CLICKHOUSE_USERNAME:default}
app.clickhouse.password=${CLICKHOUSE_PASSWORD:}
app.clickhouse.database=${CLICKHOUSE_DATABASE:default}

# ── Rate Limiting ─────────────────────────────────────────────
app.rate-limit.auth.max=${RATE_LIMIT_AUTH_MAX:20}
app.rate-limit.auth.window-ms=${RATE_LIMIT_AUTH_WINDOW_MS:900000}
app.rate-limit.api.max=${RATE_LIMIT_API_MAX:200}
app.rate-limit.api.window-ms=${RATE_LIMIT_API_WINDOW_MS:900000}
app.rate-limit.redirect.max=${RATE_LIMIT_REDIRECT_MAX:2000}
app.rate-limit.redirect.window-ms=${RATE_LIMIT_REDIRECT_WINDOW_MS:900000}

# ── Logging ───────────────────────────────────────────────────
logging.level.dev.novagk=INFO
logging.level.org.springframework.security=WARN
spring.main.banner-mode=off
